<div class="create-topic-container">
    <div class="create-topic-header">
        <h2 id="create-topic-label">Topic Description</h2>
    </div>
    <div class="topic-description-field">
        <textarea id="topic-description" placeholder="Enter topic description here..."></textarea>
    </div>
    <div class="topic-button-group">
        <div class="button" id="create-topic-button">
            Create Topic
        </div>
        <div class="button" id="cancel-topic-button">
            Cancel
        </div>
    </div>
</div>
