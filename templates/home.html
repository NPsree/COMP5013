<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Debate Table</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">    
    </head>
    <body>
        <header>
            <h1 id="Title">DEBATE TABLE</h1>
        </header>
        <div class="account-corner">
            <span id="user-greeting" class="user-greeting hidden"></span>
            <button id="Login" class="account-button">Log in</button>
            <button id="Logout" class="account-button hidden">Log out</button>
        </div>

        <div id="auth-overlay" class="auth-overlay hidden" aria-hidden="true">
            <div class="auth-box">
                <button id="auth-close" class="auth-close" type="button">×</button>

                <h2 id="auth-title">LOGIN</h2>
                <p id="auth-message" class="auth-message"></p>

                <form id="auth-form">
                    <div class="form-group">
                        <label for="auth-username">USERNAME</label>
                        <input type="text" id="auth-username" required>
                    </div>

                    <div class="form-group">
                        <label for="auth-password">PASSWORD</label>
                        <!-- <input type="password" id="auth-password" required> -->
                        <div class="password-wrapper">
                            <input type="password" id="auth-password" name="password" required>
                            <button type="button" id="toggle-password" class="password-toggle">SHOW</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit" id="auth-submit">LOGIN</button>
                    </div>
                </form>

                <button id="auth-switch" class="auth-switch" type="button">
                    Need an account? Register
                </button>
            </div>
        </div>
        <div class="main_viewport">
            <div class="navigator">
                <div id = "Home"><p class="navigator_labels">Home</p></div>
                <div id = "Featured"><p class="navigator_labels">Featured</p></div>
                <div id = "Popular"><p class="navigator_labels">Popular</p></div>
                <div id = "New"><p class="navigator_labels">New</p></div>
                <div id = "Hot"><p class="navigator_labels">Hot</p></div>
                <div id = "Controversial"><p class="navigator_labels">Controversial</p></div>
                <div id = "Login" class="accounts hidden"><p class="navigator_labels">Login</p></div>
                <div id = "Logout" class="accounts hidden"><p class="navigator_labels">Logout</p></div>
            </div>
            <div class="Page">
                <h2>Hello</h2>
                <p>Nice to have you here today!</p>
            </div>
        </div>
        <footer>
            <p>&copy; 2024 Debate Table</p>
        </footer>
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </body>
</html>
